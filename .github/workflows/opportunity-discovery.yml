name: Opportunity discovery

on:
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate endpoint configuration
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$APP_BASE_URL" || "$APP_BASE_URL" != https://* || -z "$CRON_SECRET" ]]; then
            echo "APP_BASE_URL must be HTTPS and CRON_SECRET must be configured."
            exit 1
          fi

      - name: Run opportunity collection
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 240 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/opportunities")"
          printf '%s' "$response" | jq -e \
            '.status == "succeeded" or .status == "partial" or .status == "skipped"' \
            >/dev/null
          printf '%s' "$response" | jq \
            '{status, sourcesAttempted, recordsSeen, recordsAdded, errorCount, lifecycleUpdated}'
