name: Daily digest dispatcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-digest-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate endpoint configuration
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$APP_BASE_URL" || "$APP_BASE_URL" != https://* || -z "$CRON_SECRET" ]]; then
            echo "APP_BASE_URL must be HTTPS and CRON_SECRET must be configured."
            exit 1
          fi

      - name: Run due Telegram digests
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 120 \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/api/cron/dispatcher")"
          printf '%s' "$response" | jq -e \
            '.status == "paused" or (.status == "completed" and .failed == 0)' \
            >/dev/null
          printf '%s' "$response" | jq \
            '{status, enabledUsers, connectedTelegramUsers, sent, skipped, failed}'
